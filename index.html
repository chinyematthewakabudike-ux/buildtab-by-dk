<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buildtab by DK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#e8eae8;--surface:#f6f7f5;--ink:#1d2a31;--muted:#5d6b72;--line:#c5cbc9;--steel:#2f5d7c;--hi:#f2b705;--hi-ink:#1d2a31;--danger:#a63d2f;--ok:#2d7a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161d21;--surface:#1f282d;--ink:#e8ecea;--muted:#9aa8ae;--line:#34424a;--steel:#7fb0d1;--hi-ink:#161d21;--danger:#e0806f;--ok:#6fcf97}}
:root[data-theme="dark"]{--bg:#161d21;--surface:#1f282d;--ink:#e8ecea;--muted:#9aa8ae;--line:#34424a;--steel:#7fb0d1;--hi-ink:#161d21;--danger:#e0806f;--ok:#6fcf97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:16px}
h1,h2,h3{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
h1{font-size:30px}h2{font-size:24px}h3{font-size:19px}
input,textarea,button,select{font:inherit;color:inherit}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--steel);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab,.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.main{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:820px){.main{grid-template-columns:1.15fr 1fr;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.main .panel{margin-bottom:0}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:13px;color:var(--muted);text-align:center;padding-bottom:2px}
.day{aspect-ratio:1/1;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:3px 4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;font-weight:500}
.day.empty{visibility:hidden}
.day small{font-size:11px;color:var(--muted);line-height:1.1}
.day.logged{border-bottom:5px solid var(--hi)}
.day.today{box-shadow:inset 0 0 0 2px var(--steel)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel small{color:var(--bg)}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.row{display:grid;grid-template-columns:1fr 70px 32px;gap:6px;margin-bottom:6px}
.row .task{grid-column:1/3}
.mrow{display:grid;grid-template-columns:1fr 90px 32px;gap:6px;margin-bottom:6px}
.x{border:0;background:transparent;color:var(--danger);font-size:20px;cursor:pointer;border-radius:6px}
.tot{margin-top:10px;font-weight:600}
.muted,.empty-msg{color:var(--muted)}
.scroll{overflow-x:auto;margin:8px 0}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:'Barlow Condensed',sans-serif;font-size:17px;white-space:nowrap}
td input,td select{min-width:70px;padding:6px 8px}
td.n,th.n{text-align:right}
tfoot td{font-weight:600;border-top:2px solid var(--ink)}
.neg{color:var(--danger);font-weight:600}.pos{color:var(--ok);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;background:var(--bg)}
.add{display:flex;gap:6px;margin-top:8px}.add input{max-width:260px}
.entry{padding:10px 0;border-bottom:1px solid var(--line)}
.entry p{margin:2px 0 0;color:var(--muted)}
[hidden]{display:none!important}
.pbar{background:var(--ink);color:var(--bg);border-radius:8px;padding:14px 16px;margin-bottom:14px;border-left:8px solid var(--hi)}
.pbar .pl{color:var(--bg);opacity:.85;font-size:13px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.08em}
.pbar .pname{font:700 clamp(26px,6vw,38px)/1.1 'Barlow Condensed',sans-serif;background:transparent;color:var(--bg);border:0;border-bottom:2px dashed var(--hi);border-radius:0;padding:2px 0;width:100%}
.pbar .pname:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.prow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.prow select{max-width:320px;flex:1 1 200px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat strong{font:700 22px 'Barlow Condensed',sans-serif}
.entry p strong{color:var(--ink)}
.pcard{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--bg)}
.pcard.act{border-color:var(--steel);border-left:6px solid var(--hi)}
.pcard p{margin:2px 0 0}
.badge{font:600 12px Barlow,sans-serif;background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:2px 8px;vertical-align:middle}
.pbtns{display:flex;gap:6px;flex-wrap:wrap}
.stgl{list-style:none;margin:8px 0;padding:0}
.stg{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.stg input{flex:1;min-width:120px}
.stg .btn{padding:6px 10px}
.stg .num{width:22px;text-align:right}
.tblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 12px;border:1px solid var(--line);border-radius:8px;padding:4px 12px 12px;margin:10px 0;background:var(--bg)}
.sig{grid-column:1/-1;margin-top:14px}
.unsure{background:rgba(242,183,5,.2)}
body.locked .wrap{display:none}
#auth{display:none;min-height:100vh;align-items:center;justify-content:center;padding:16px}
body.locked #auth{display:flex}
.acard{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--hi);border-radius:8px;padding:20px;width:100%;max-width:380px}
#amsg{min-height:1.4em;margin:10px 0 6px}
</style>
</head>
<body class="locked">
<div id="auth"><div class="acard">
<h1>Buildtab <span style="font-size:.55em;font-weight:600;color:var(--muted)">by DK</span></h1>
<p class="muted" id="amode">Sign in to open your site logs.</p>
<div id="aemailbox"><label for="aemail">Email</label><input id="aemail" type="email" autocomplete="email"></div>
<label id="aplabel" for="apass">Password (min 6 characters)</label><input id="apass" type="password" autocomplete="current-password">
<p id="amsg" role="alert"></p>
<button class="btn primary" id="agoo" style="width:100%">Sign in</button>
<button class="btn" id="aswitch" style="width:100%;margin-top:8px">Create a new account</button>
<button class="btn" id="aforgot" style="width:100%;margin-top:8px;border-style:dashed">Forgot password?</button>
</div></div>
<div class="wrap">
<header>
  <h1>Buildtab <span style="font-size:.55em;font-weight:600;color:var(--muted)">by DK</span></h1>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="btn primary" id="savebtn">Save now</button><span class="muted" id="sync" style="font-size:13px" aria-live="polite"></span><button class="btn" id="signout">Sign out</button></div>
</header>
<section class="pbar" aria-label="Current project">
  <label class="pl" for="proj">Current project</label>
  <input id="proj" class="pname" placeholder="Name your project" autocomplete="off">
  <div class="prow"><label class="pl" for="pswitch" style="margin:0">Switch to</label><select id="pswitch"></select><button class="btn primary" id="newp">+ New project</button></div>
</section>
<div class="tabs" role="tablist" id="tabs" style="margin-bottom:14px">
  <button class="tab" role="tab" data-tab="proj" aria-selected="false">Projects</button>
  <button class="tab" role="tab" data-tab="cal" aria-selected="true">Calendar</button>
  <button class="tab" role="tab" data-tab="boq" aria-selected="false">BOQ</button>
  <button class="tab" role="tab" data-tab="pay" aria-selected="false">Pay</button>
  <button class="tab" role="tab" data-tab="mat" aria-selected="false">Materials</button>
  <button class="tab" role="tab" data-tab="sum" aria-selected="false">Summary</button>
</div>

<section id="v-cal" class="main">
  <div class="panel">
    <div class="mhead">
      <button class="btn" id="prev" aria-label="Previous month">‹</button>
      <h2 id="mtitle"></h2>
      <button class="btn" id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="cells"></div>
  </div>
  <div class="panel" id="dayp"></div>
</section>
<section id="v-proj" hidden></section>
<section id="v-boq" hidden></section>
<section id="v-pay" hidden></section>
<section id="v-mat" hidden></section>
<section id="v-sum" hidden></section>
</div>
<datalist id="wl"></datalist>
<datalist id="units"><option value="m"><option value="m2"><option value="m3"><option value="lm"><option value="no"><option value="kg"><option value="tonne"><option value="bag"><option value="litre"><option value="trip"><option value="item"><option value="sum"></datalist>

<script>
window.startBuildtab=function(uid){
var KEY='site-daily-log-v1:'+uid, R={projects:[],active:null}, S={};
function pid(){return 'p'+Date.now()+Math.floor(Math.random()*999)}
function newProj(name){return {id:pid(),project:name||'Untitled project',days:{},workers:[],sched:[],materials:[],stages:['Foundation','Walling','Roofing','Finishing']}}
function norm(){R.projects.forEach(function(p){p.id=p.id||pid();p.project=p.project||'Untitled project';p.days=p.days||{};p.workers=p.workers||[];p.sched=p.sched||[];p.materials=p.materials||[];p.boq=p.boq||[];p.boqInfo=p.boqInfo||{title:'',consultant:'',date:''};p.stages=p.stages||['Foundation','Walling','Roofing','Finishing'];p.sched.forEach(function(r){if(r.amt===undefined){var pd=parseFloat(r.paid)>0;r.amt=pd?r.paid:(r.due||'');r.st=pd?'paid':'planned'}r.st=r.st||'paid'})})}
function loadRoot(o){
  if(o&&o.projects&&o.projects.length){R=o}
  else if(o&&typeof o==='object'&&(o.days||o.workers||o.project!==undefined)){o.id=o.id||pid();o.project=o.project||'My project';R={projects:[o],active:o.id,savedAt:o.savedAt}}
  else{var p=newProj('My first project');R={projects:[p],active:p.id}}
  norm();
  S=R.projects.filter(function(p){return p.id===R.active})[0]||R.projects[0];R.active=S.id;syncBoq();
}
var cloud={ref:null,t:null};
function setSync(t){var e=document.getElementById('sync');if(e)e.textContent=t}
function cloudSave(){
  if(!cloud.ref)return; clearTimeout(cloud.t); setSync('Saving…');
  cloud.t=setTimeout(function(){
    cloud.ref.set({json:JSON.stringify(R),savedAt:R.savedAt}).then(function(){setSync('All changes saved to your account')}).catch(function(){setSync('Saved on this device only')});
  },800);
}
function save(){R.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}cloudSave()}
function saveNow(){
  R.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}
  var t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(!cloud.ref){setSync('Saved on this device at '+t);return}
  clearTimeout(cloud.t);setSync('Saving…');
  cloud.ref.set({json:JSON.stringify(R),savedAt:R.savedAt}).then(function(){setSync('Saved to your account at '+t)}).catch(function(){setSync('Could not reach your account. Saved on this device at '+t)});
}
try{var raw=localStorage.getItem(KEY);loadRoot(raw?JSON.parse(raw):null)}catch(e){loadRoot(null)}
var $=function(i){return document.getElementById(i)};
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var now=new Date(), vy=now.getFullYear(), vm=now.getMonth(), sel=null, cur='cal';
function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
var todayIso=iso(now.getFullYear(),now.getMonth(),now.getDate());
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fm(n){var r=Math.round(n*100)/100;return (r<0?'-':'')+'₦'+Math.abs(r).toLocaleString('en-NG')}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function rec(k){var d=S.days[k]||(S.days[k]={work:'',stage:'',entries:[],mats:[]});d.mats=d.mats||[];d.stage=d.stage||'';return d}
function hrs(k){var d=S.days[k];return d?d.entries.reduce(function(a,e){return a+num(e.hours)},0):0}
function logged(k){var d=S.days[k];return d&&(d.work.trim()||d.entries.length||(d.mats&&d.mats.length))}
function fmtDate(k){var p=k.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return DN[d.getDay()]+', '+d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear()}
function wk(n){return S.workers.filter(function(w){return w.name===n})[0]}
function mt(id){return S.materials.filter(function(m){return m.id===id})[0]}
function earn(e){
  var w=wk(e.name.trim()); if(!w||!num(w.rate))return 0;
  var h=parseFloat(e.hours);
  if(w.basis==='day')return (isNaN(h)||h>0)?num(w.rate):0;
  return num(e.hours)*num(w.rate);
}
function usedQty(id){var t=0;Object.keys(S.days).forEach(function(k){(S.days[k].mats||[]).forEach(function(m){if(m.id===id)t+=num(m.qty)})});return t}
function allWorkers(){var s={};S.workers.forEach(function(w){s[w.name]=1});Object.keys(S.days).forEach(function(k){S.days[k].entries.forEach(function(e){if(e.name.trim())s[e.name.trim()]=1})});return Object.keys(s).sort()}
function syncWorkers(){var ch=false;allWorkers().forEach(function(n){if(!wk(n)){S.workers.push({name:n,trade:'',rate:'',basis:'hour'});ch=true}});if(ch)save()}
function opts(list,sel,blank){return (blank!==undefined?'<option value="">'+esc(blank)+'</option>':'')+list.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===sel?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')}

$('proj').addEventListener('input',function(){S.project=this.value;save();drawBar(false)});
$('pswitch').addEventListener('change',function(){switchProject(this.value)});
$('newp').addEventListener('click',function(){showTab('proj');var n=$('np');if(n)n.focus()});
$('dows').innerHTML=DN.map(function(d){return '<div class="dow">'+d+'</div>'}).join('');

/* ---------- Calendar + day ---------- */
function drawCal(){
  $('mtitle').textContent=MN[vm]+' '+vy;
  var first=new Date(vy,vm,1).getDay(), n=new Date(vy,vm+1,0).getDate(), h='';
  for(var i=0;i<first;i++)h+='<div class="day empty"></div>';
  for(var d=1;d<=n;d++){
    var k=iso(vy,vm,d), t=hrs(k), c=(S.days[k]?S.days[k].entries.length:0);
    var cls='day'+(logged(k)?' logged':'')+(k===todayIso?' today':'')+(k===sel?' sel':'');
    h+='<button class="'+cls+'" data-k="'+k+'" aria-label="'+fmtDate(k)+'"><span>'+d+'</span><small>'+(c?c+' w · '+t+'h':'')+'</small></button>';
  }
  $('cells').innerHTML=h;
}
$('cells').addEventListener('click',function(e){
  var b=e.target.closest('.day[data-k]'); if(!b)return;
  sel=b.dataset.k; drawCal(); drawDay();
  if(window.innerWidth<820)$('dayp').scrollIntoView({behavior:'smooth'});
});
$('prev').onclick=function(){vm--;if(vm<0){vm=11;vy--}drawCal()};
$('next').onclick=function(){vm++;if(vm>11){vm=0;vy++}drawCal()};

function drawDay(){
  var p=$('dayp');
  if(!sel){p.innerHTML='<h3>Day log</h3><p class="empty-msg">Tap a date to record the work done, who was on site and materials used.</p>';return}
  var d=rec(sel);
  $('wl').innerHTML=allWorkers().map(function(w){return '<option value="'+esc(w)+'">'}).join('');
  var rows=d.entries.map(function(e,i){
    return '<div class="row" data-i="'+i+'"><input data-f="name" list="wl" placeholder="Worker name" aria-label="Worker name" value="'+esc(e.name)+'">'+
    '<input data-f="hours" type="number" min="0" max="24" step="0.5" placeholder="Hrs" aria-label="Hours worked" value="'+esc(e.hours)+'">'+
    '<button class="x" data-del="'+i+'" aria-label="Remove worker">×</button>'+
    '<input class="task" data-f="task" placeholder="Task done (e.g. blockwork)" aria-label="Task done" value="'+esc(e.task)+'"></div>';
  }).join('');
  var mopts=S.materials.map(function(m){var r=num(m.received)-usedQty(m.id);return [m.id,(m.name||'(unnamed)')+' ('+r+(m.unit?' '+m.unit:'')+' in stock)']});
  var mrows=d.mats.map(function(m,i){
    var u=(mt(m.id)||{}).unit||'';
    return '<div class="mrow" data-i="'+i+'"><select data-mf="id" aria-label="Material">'+opts(mopts,m.id,'Choose material')+'</select>'+
    '<input data-mf="qty" type="number" min="0" step="any" placeholder="Qty" aria-label="Quantity used" value="'+esc(m.qty)+'">'+
    '<button class="x" data-delm="'+i+'" aria-label="Remove material">×</button></div>';
  }).join('');
  p.innerHTML='<h3>'+fmtDate(sel)+'</h3>'+
   '<label for="stg">Project stage</label><select id="stg">'+opts(S.stages.map(function(s){return [s,s]}),d.stage,'No stage')+'</select><button class="btn" id="editstg" style="margin-top:6px">Add, rename or remove stages</button>'+
   '<label for="work">Work done today</label><textarea id="work" placeholder="e.g. Poured column footings, set out block wall">'+esc(d.work)+'</textarea>'+
   '<label>Workers on site today</label>'+rosterHtml()+copyHtml()+'<div id="rows">'+(rows||'<p class="empty-msg">No workers added yet.</p>')+'</div>'+
   '<button class="btn primary" id="addw">Add worker</button>'+
   '<div class="tot" id="tot">Total: '+hrs(sel)+' hours</div>'+
   '<label>Materials used</label><div id="mrows">'+(mrows||(S.materials.length?'<p class="empty-msg">None recorded.</p>':'<p class="empty-msg">Add materials in the Materials tab first.</p>'))+'</div>'+
   (S.materials.length?'<button class="btn" id="addm">Add material used</button>':'')+'<h3 style="margin-top:16px">Day summary</h3><div id="dsum"></div>';
  refreshDaySum();
  $('work').addEventListener('input',function(){rec(sel).work=this.value;save();updateCell(sel)});
  $('stg').addEventListener('change',function(){rec(sel).stage=this.value;save();refreshDaySum()});
  $('editstg').onclick=function(){showTab('proj');var el=$('stages');if(el)el.scrollIntoView();var n=$('ns');if(n)n.focus()};
  $('addw').onclick=function(){rec(sel).entries.push({name:'',hours:'',task:''});save();drawDay();drawCal();var r=document.querySelectorAll('#rows .row');if(r.length)r[r.length-1].querySelector('input').focus()};
  if($('addm'))$('addm').onclick=function(){rec(sel).mats.push({id:'',qty:''});save();drawDay()};
}
$('dayp').addEventListener('input',function(e){
  setTimeout(refreshDaySum,0);
  var f=e.target.dataset.f, mf=e.target.dataset.mf, row=e.target.closest('.row,.mrow'); if(!row)return;
  if(f){rec(sel).entries[+row.dataset.i][f]=e.target.value;save();$('tot').textContent='Total: '+hrs(sel)+' hours'}
  else if(mf){rec(sel).mats[+row.dataset.i][mf]=e.target.value;save()}
});
$('dayp').addEventListener('change',function(e){if(e.target.dataset.f==='name'||e.target.dataset.f==='hours')updateCell(sel)});
$('dayp').addEventListener('click',function(e){
  var r=e.target.closest('[data-ros]');
  if(r){var nm=S.workers[+r.dataset.ros].name,dd=rec(sel),ix=-1;dd.entries.forEach(function(x,i){if(ix<0&&x.name.trim()===nm)ix=i});if(ix>=0)dd.entries.splice(ix,1);else dd.entries.push({name:nm,hours:'',task:''});save();drawDay();drawCal();return}

function sumData(){
  syncWorkers();
  var order=S.stages.slice(), BW={}, ST={};
  function st(s){return ST[s]||(ST[s]={days:0,hours:0,earn:0,mat:0})}
  Object.keys(S.days).sort().forEach(function(k){
    var d=S.days[k], s=d.stage||'';
    if(logged(k)){st(s).days++; if(s&&order.indexOf(s)<0)order.push(s)}
    d.entries.forEach(function(e){var n=e.name.trim(); if(!n)return; var a=earn(e);
      st(s).hours+=num(e.hours); st(s).earn+=a;
      var w=BW[n]||(BW[n]={}); w[s]=(w[s]||0)+a});
    (d.mats||[]).forEach(function(m){var x=mt(m.id); if(x)st(s).mat+=num(m.qty)*num(x.cost)});
  });
  if(ST['']&&(ST[''].days||ST[''].earn))order.push('');
  var paid={}; S.sched.forEach(function(r){if(r.worker)paid[r.worker]=(paid[r.worker]||0)+paidOf(r)});
  var names=S.workers.map(function(w){return w.name}).sort(), gE=0,gP=0, colT={};
  var rows=names.map(function(n){var w=wk(n),t=0;
    var cells=order.map(function(s){var a=(BW[n]&&BW[n][s])||0;t+=a;colT[s]=(colT[s]||0)+a;return a});
    var p=paid[n]||0;gE+=t;gP+=p;
    return {name:n,trade:(w&&w.trade)||'',cells:cells,t:t,p:p,b:t-p}});
  var cum=0, srows=order.map(function(s){var x=st(s);cum+=x.earn;return {s:s,days:x.days,hours:x.hours,earn:x.earn,cum:cum,mat:x.mat}});
  return {order:order,rows:rows,colT:colT,gE:gE,gP:gP,srows:srows,

}

    }else if(mode==='in'){var r=await sb.auth.signInWithPassword({email:email,password:pw});if(r.error)throw r.error;start(r.data.session)}
    else{var s=await sb.auth.signUp({email:email,password:pw});if(s.error)throw s.error;
      if(s.data.session)start(s.data.session);else{msg('Account created. Check your email and click the confirmation link, then sign in.',true);setMode('in')}}
  }catch(e){msg(e.message||'Something went wrong. Try again.')}
  $('agoo').disabled=false;
}
async function forgot(){
  var email=$('aemail').value.trim();
  if(!email){msg('Type your email above first, then tap Forgot password.');return}
  $('aforgot').disabled=true; msg('Please wait…',true);
  try{
    var r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(r.error)throw r.error;
    msg('If that email has an account, a reset link is on its way. Open the link on this device.',true);
  }catch(e){msg(e.message||'Could not send the reset email. Try again later.')}
  $('aforgot').disabled=false;
}
$('agoo').onclick=go; $('aforgot').onclick=forgot; $('aswitch').onclick=function(){setMode(mode==='in'?'up':'in')};
['aemail','apass'].forEach(function(id){$(id).addEventListener('keydown',function(e){if(e.key==='Enter')go()})});
$('signout').onclick=async function(){await sb.auth.signOut();location.reload()};
sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'&&!started){recovering=true;setMode('reset')}});
if(recovering)setMode('reset');
else if(hashErr)msg(decodeURIComponent(hashErr[1].replace(/\+/g,' '))+'. Request a new reset link.');
sb.auth.getSession().then(function(r){if(!recovering&&r.data&&r.data.session)start(r.data.session)});
})();
</script>
</body>
